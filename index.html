<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>היומן של מיקה 🌊</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/he.js"></script>

    <style>
        :root { 
            --primary: #1e4b7a; --accent: #00B4D8; --bg: #F8FAFC;
            --card: #FFFFFF; --text: #1E293B; --success: #4FD1C5; --error: #FC8181;
            --radius: 20px; --shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, -apple-system; background: var(--bg); margin: 0; padding-bottom: 100px; color: var(--text); overflow-x: hidden; }

        .app-container { max-width: 500px; margin: 0 auto; padding: 16px; }
        header { background: white; border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); margin-bottom: 20px; text-align: center; }

        .patient-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .patient-card { background: white; padding: 25px 15px; border-radius: 18px; box-shadow: var(--shadow); text-align: center; font-weight: 700; color: var(--primary); border: 1px solid #f1f5f9; }

        .daily-schedule { display: none; }
        .slot-card { background: white; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; border: 1px solid #f1f5f9; }
        .time-tag { background: var(--primary); color: white; padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; }
        .slot-name { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-right: 10px; flex: 1; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 24px; z-index: 2000; width: 92%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1500; }
        .close-modal { position: absolute; top: 15px; left: 15px; font-size: 28px; font-weight: bold; color: #cbd5e1; cursor: pointer; }

        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .btn-status { height: 60px; border-radius: 15px; border: 2px solid #eee; font-size: 1.1rem; font-weight: bold; }
        .btn-status.v-active { background: var(--success); color: white; border-color: var(--success); }
        .btn-status.x-active { background: var(--error); color: white; border-color: var(--error); }

        .save-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-weight: bold; font-size: 1.1rem; margin-top: 10px; }
        
        /* ניהול שמות - רשימה פנימית */
        .admin-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .delete-btn { color: var(--error); font-weight: bold; padding: 5px 10px; }
        
        .patient-select-list { display: none; background: #f8fafc; border-radius: 15px; padding: 10px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .patient-select-item { padding: 12px; background: white; margin-bottom: 8px; border-radius: 10px; text-align: center; font-weight: 700; color: var(--primary); border: 1px solid #edf2f7; }

        .fab { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; height: 60px; background: var(--primary); color: white; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); z-index: 100; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin: 5px 0; font-family: inherit; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h2 style="margin:0 0 10px 0;">היומן של מיקה 🌊</h2>
        <div id="calendar-inline"></div>
    </header>
    <div id="all-patients-view" class="patient-grid"></div>
    <div id="daily-schedule-view" class="daily-schedule"></div>
</div>

<button class="fab" onclick="openAdminModal()">⚙️ ניהול מטופלים והגדרות</button>

<div class="overlay" id="overlay" onclick="closeModal()"></div>

<div class="modal" id="modal-report">
    <span class="close-modal" onclick="closeModal()">×</span>
    <h3 id="report-title" style="text-align:center; color:var(--primary);">סיכום מפגש</h3>
    <button style="background:#f1f5f9; border:1px solid #ddd; width:100%; padding:10px; border-radius:10px; font-weight:bold; margin-bottom:10px;" onclick="toggleSwitchList()">🔄 החלף מטופל בשעה זו</button>
    <div id="switch-patient-list" class="patient-select-list"></div>
    <div class="action-btns">
        <button id="btn-v" class="btn-status" onclick="setReportStatus('v')">הגיע/ה ✅</button>
        <button id="btn-x" class="btn-status" onclick="setReportStatus('x')">ביטול ❌</button>
    </div>
    <textarea id="report-note" placeholder="דגשים לטיפול..." rows="3" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; margin-bottom:10px; font-family:inherit;"></textarea>
    <button class="save-btn" onclick="saveReport()">שמור דיווח</button>
</div>

<div class="modal" id="modal-profile">
    <span class="close-modal" onclick="closeModal()">×</span>
    <h3 id="prof-title" style="text-align:center; color:var(--primary);"></h3>
    <label>גיל:</label><input type="text" id="prof-age">
    <label>אבחנה:</label><input type="text" id="prof-diag">
    <label>מכסת טיפולים:</label><input type="number" id="prof-limit">
    <div id="prof-summary" style="text-align:center; padding:15px; font-weight:bold; color:var(--accent)"></div>
    <button class="save-btn" onclick="saveProfile()">שמור עדכון</button>
</div>

<div class="modal" id="modal-admin">
    <span class="close-modal" onclick="closeModal()">×</span>
    <h3 style="text-align:center; color:var(--primary);">ניהול מטופלים</h3>
    
    <div style="background:#f1f5f9; padding:15px; border-radius:15px; margin-bottom:20px;">
        <h4 style="margin:0 0 10px 0;">הוספת מטופל חדש</h4>
        <input type="text" id="new-patient-name" placeholder="שם מלא">
        <button class="save-btn" onclick="addNewPatient()">הוסף לרשימה</button>
    </div>

    <h4 style="margin:0 0 10px 0;">רשימת המטופלים שלך:</h4>
    <div id="admin-patient-list" style="border:1px solid #eee; border-radius:10px;"></div>
    <p style="font-size:0.8rem; color:#666; margin-top:15px;">* מחיקת מטופל תסיר אותו מהקוביות בדף הבית, אך לא תמחק היסטוריית טיפולים קיימת.</p>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAiv5s0YzbauqtBcF2ZuyRSsy8HtBt8RPc",
      authDomain: "hydro-diary-fc1fe.firebaseapp.com",
      databaseURL: "https://hydro-diary-fc1fe-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "hydro-diary-fc1fe",
      storageBucket: "hydro-diary-fc1fe.firebasestorage.app",
      messagingSenderId: "590857313156",
      appId: "1:590857313156:web:18cf7339b904dfa5365bd1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref();

    let globalData = { schedule: {}, config: {}, patientList: [] };
    let activeDate = null;
    let currentSlotId = null;
    let tempStatus = "";
    let activePatientName = "";

    const HOURS = { 
        0: ["12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00"],
        1: ["13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00"]
    };

    // רשימת ה-AUTO שאת יכולה לערוך כאן בקוד אם השתנה הלו"ז הקבוע
    const AUTO_LIST = {
        0: ["תבל דמקה", "אלה דמקה", "רפאל אגמייב", "יגל לוצקי", "אוריה לוצקי", "אריאל מלול", "אוריה חיים"],
        1: ["אלרועי פרנקו", "ישי שלמה", "שניאור זלמן", "אלי קלין", "שירה יצחק", "שי יצחק"]
    };

    flatpickr("#calendar-inline", {
        inline: true, locale: "he",
        onChange: (selectedDates, dateStr) => {
            activeDate = (activeDate === dateStr) ? null : dateStr;
            if (activeDate) autoPopulate(activeDate);
            render();
        }
    });

    db.on('value', (snap) => {
        const val = snap.val() || {};
        globalData = {
            schedule: val.schedule || {},
            config: val.config || {},
            patientList: val.patientList || []
        };
        render();
        if(document.getElementById('modal-admin').style.display === 'block') renderAdminList();
    });

    function render() {
        const allView = document.getElementById('all-patients-view');
        const dailyView = document.getElementById('daily-schedule-view');
        const day = activeDate ? new Date(activeDate).getDay() : -1;

        if (!activeDate || (day !== 0 && day !== 1)) {
            allView.style.display = 'grid';
            dailyView.style.display = 'none';
            allView.innerHTML = (globalData.patientList || []).map(name => 
                `<div class="patient-card" onclick="openProfile('${name}')">${name}</div>`
            ).join('');
        } else {
            allView.style.display = 'none';
            dailyView.style.display = 'block';
            const slots = HOURS[day] || [];
            dailyView.innerHTML = slots.map(time => {
                const id = `${activeDate}_${time}`.replace(/:/g, '');
                const slot = globalData.schedule[id] || { name: "פנוי" };
                const icon = slot.status === 'v' ? '✅' : (slot.status === 'x' ? '❌' : '');
                return `
                    <div class="slot-card" onclick="openReportModal('${id}', '${slot.name}')">
                        <div class="time-tag">${time}</div>
                        <div class="slot-name">${slot.name}</div>
                        <div style="font-size:1.5rem">${icon}</div>
                    </div>`;
            }).join('');
        }
    }

    function autoPopulate(dateStr) {
        const day = new Date(dateStr).getDay();
        if (day !== 0 && day !== 1) return;
        const slots = HOURS[day];
        const list = AUTO_LIST[day];
        let exists = false;
        slots.forEach(t => { if(globalData.schedule[`${dateStr}_${t}`.replace(/:/g, '')]) exists = true; });
        if (!exists) {
            let updates = {};
            list.forEach((name, i) => {
                if(slots[i]) {
                    const id = `${dateStr}_${slots[i]}`.replace(/:/g, '');
                    updates[id] = { name, status: "", note: "" };
                }
            });
            db.child('schedule').update(updates);
        }
    }

    // --- פונקציות ניהול (Admin) ---
    function openAdminModal() {
        document.getElementById('modal-admin').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
        renderAdminList();
    }

    function renderAdminList() {
        const container = document.getElementById('admin-patient-list');
        container.innerHTML = (globalData.patientList || []).map((name, index) => `
            <div class="admin-list-item">
                <span>${name}</span>
                <span class="delete-btn" onclick="removePatient(${index})">מחק 🗑️</span>
            </div>
        `).join('');
    }

    function addNewPatient() {
        const input = document.getElementById('new-patient-name');
        const name = input.value.trim();
        if(name) {
            let list = globalData.patientList || [];
            list.push(name);
            db.child('patientList').set(list);
            input.value = "";
        }
    }

    function removePatient(index) {
        if(confirm("בטוח שרוצה למחוק את המטופל מהרשימה הכללית?")) {
            let list = globalData.patientList;
            list.splice(index, 1);
            db.child('patientList').set(list);
        }
    }

    // --- שאר הפונקציות (דיווח ופרופיל) ---
    function openReportModal(id, name) {
        currentSlotId = id;
        const slot = globalData.schedule[id] || { name: "פנוי" };
        tempStatus = slot.status || "";
        document.getElementById('report-title').innerText = `${slot.name}`;
        document.getElementById('report-note').value = slot.note || "";
        document.getElementById('switch-patient-list').style.display = 'none';
        updateStatusBtns();
        document.getElementById('modal-report').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function toggleSwitchList() {
        const listDiv = document.getElementById('switch-patient-list');
        listDiv.style.display = (listDiv.style.display === 'none' || listDiv.style.display === '') ? 'block' : 'none';
        listDiv.innerHTML = (globalData.patientList || []).map(name => 
            `<div class="patient-select-item" onclick="switchPatient('${name}')">${name}</div>`
        ).join('');
    }

    function switchPatient(newName) {
        db.child('schedule').child(currentSlotId).update({ name: newName });
        document.getElementById('report-title').innerText = newName;
        document.getElementById('switch-patient-list').style.display = 'none';
    }

    function setReportStatus(s) {
        tempStatus = (tempStatus === s) ? "" : s;
        updateStatusBtns();
    }

    function updateStatusBtns() {
        document.getElementById('btn-v').className = 'btn-status' + (tempStatus === 'v' ? ' v-active' : '');
        document.getElementById('btn-x').className = 'btn-status' + (tempStatus === 'x' ? ' x-active' : '');
    }

    function saveReport() {
        db.child('schedule').child(currentSlotId).update({ status: tempStatus, note: document.getElementById('report-note').value });
        closeModal();
    }

    function openProfile(name) {
        activePatientName = name;
        const conf = globalData.config[name] || {};
        document.getElementById('prof-title').innerText = name;
        document.getElementById('prof-age').value = conf.age || "";
        document.getElementById('prof-diag').value = conf.diag || "";
        document.getElementById('prof-limit').value = conf.limit || 12;
        let done = 0;
        Object.values(globalData.schedule).forEach(s => { if(s.name === name && s.status === 'v') done++; });
        document.getElementById('prof-summary').innerText = `ניצול מכסה: ${done} / ${conf.limit || 12}`;
        document.getElementById('modal-profile').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function saveProfile() {
        db.child('config').child(activePatientNameName).update({
            age: document.getElementById('prof-age').value,
            diag: document.getElementById('prof-diag').value,
            limit: document.getElementById('prof-limit').value
        });
        closeModal();
    }

    function closeModal() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('overlay').style.display = 'none';
    }
</script>
</body>
</html>
